<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10263f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Programming Adventure">
<title>Programming Adventure</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#10263f;--blue:#2F7DE1;--mint:#12B58C;--coral:#F2645A;--sun:#F5B83D;--violet:#7A5AF8;--cream:#f3f7fb;--text:#1f2a3c;--muted:#68768c;--line:#dde6f0;--r:20px;--c:#2F7DE1;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--cream);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3,h4{font-family:'Baloo 2','Nunito',sans-serif;color:var(--navy);line-height:1.15}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:1rem}
code,pre,textarea.code{font-family:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace}
a{color:var(--blue)}
#app{max-width:820px;margin:0 auto;padding:0 16px calc(96px + var(--sab));min-height:100dvh}
.hide{display:none!important}
.muted{color:var(--muted)}.small{font-size:.85rem}.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.row{display:flex;gap:10px;align-items:center}.wrapx{display:flex;flex-wrap:wrap;gap:8px}

/* top bar, hero */
.topbar{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(var(--sat) + 10px) 16px 10px;background:rgba(243,247,251,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.topbar h2{font-size:1.2rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:1.25rem;display:grid;place-items:center;flex:none}
.starpill{background:var(--navy);color:var(--sun);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.95rem;white-space:nowrap}
.hero{margin:0 -16px;padding:calc(var(--sat) + 14px) 16px 58px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,#10263f 0%,#2a5fa8 100%)}
.hero .traces{position:absolute;inset:0;width:100%;height:100%;opacity:.14;pointer-events:none}
.hero .row{position:relative;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;position:relative}
.brand .logo{width:46px;height:46px;border-radius:14px;background:var(--sun);display:grid;place-items:center;font-size:1.6rem;box-shadow:0 0 0 4px rgba(245,184,61,.3)}
.brand h1{color:#fff;font-size:1.4rem;font-weight:800}.brand small{display:block;font-size:.8rem;opacity:.9;font-weight:700}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px 6px 8px;color:#fff;font-weight:800}
.who .av{font-size:1.5rem}
.hello{position:relative;margin-top:16px;font-family:'Baloo 2';font-weight:800;font-size:1.45rem}
.hello span{display:block;font-family:'Nunito';font-weight:600;font-size:.95rem;opacity:.9;margin-top:2px}

/* cards, buttons */
.card{background:#fff;border-radius:var(--r);box-shadow:0 4px 16px rgba(16,38,63,.08);padding:16px;margin:14px 0}
.card.flat{box-shadow:none;border:2px solid var(--line)}
.card.good{border:3px solid var(--mint)}.card.bad{border:3px solid var(--coral);background:#fff6f5}.card.hint{background:#fff9e6;border:2px solid #f3dd96}
.sec{margin:24px 0 8px;font-size:1.15rem}
.btn{border:none;border-radius:16px;padding:13px 20px;font-weight:800;font-size:1rem;background:var(--blue);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.mint{background:var(--mint);color:#053b2f}.btn.coral{background:var(--coral)}.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:none}
.btn.wide{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}.btn.big{font-size:1.25rem;padding:16px 28px;border-radius:20px;min-height:60px}.btn.small{min-height:40px;padding:8px 14px;font-size:.9rem;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e6eefb;color:var(--navy);border-radius:999px;padding:7px 13px;font-weight:700;font-size:.88rem;border:none}
.chip.on{background:var(--navy);color:#fff}.chip.btnlike:active{transform:scale(.95)}
.say{border:2px solid var(--blue);background:#eaf2ff;color:var(--blue);border-radius:999px;width:44px;height:44px;font-size:1.2rem;flex:none}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none}.inp:focus{border-color:var(--blue)}
.inp.pin{text-align:center;font-size:1.5rem;letter-spacing:8px;max-width:220px;margin:0 auto;display:block}
label.lbl{display:block;font-weight:800;margin:12px 0 6px;color:var(--navy)}
.feedback{margin-top:8px;font-weight:700}.feedback.good{color:#0a7a5c}.feedback.bad{color:#c0392b}
.stars span.off{filter:grayscale(1);opacity:.3}.stars{letter-spacing:2px}
.bigem{font-size:3.4rem;line-height:1.1}
.av{border:2px solid var(--line);background:#fff;border-radius:14px;width:46px;height:46px;font-size:1.5rem}.av.on{border-color:var(--blue);background:#eaf2ff}

/* home */
.podcard{display:flex;align-items:center;gap:12px;width:100%;margin:-34px 0 0;position:relative;text-align:left;border:none;border-radius:20px;padding:14px 16px;background:#fff;box-shadow:0 6px 18px rgba(16,38,63,.16);font:inherit;border-left:8px solid var(--c)}
.podcard .em{font-size:2rem}.podcard .tx{display:flex;flex-direction:column;min-width:0;flex:1}.podcard small{font-weight:800;letter-spacing:.08em;color:var(--coral);font-size:.7rem}.podcard b{font-family:'Baloo 2';font-size:1.15rem;color:var(--navy)}.podcard .tx span{font-size:.82rem;color:var(--muted)}.podcard .go{font-size:1.6rem;color:var(--c)}
.tile{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:none;border-radius:18px;padding:14px;background:linear-gradient(135deg,#F2645A,#d94a5a);color:#fff;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.16)}
.tile.alt{background:linear-gradient(135deg,#7A5AF8,#5b3fd1)}.tile .em{font-size:1.8rem}.tile b{font-family:'Baloo 2';font-size:1.1rem}
.pathcard{display:block;width:100%;text-align:left;border:none;font:inherit}
.bar{height:10px;background:#e3ebf5;border-radius:99px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.whorow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}.whorow.on{border-color:var(--blue)}.whorow>span:nth-child(2){flex:1}.bigav{font-size:2rem}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:12px}
.chbtn{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem}
.chbtn b{font-family:'Baloo 2';font-size:1.1rem;color:var(--navy)}.chbtn.done{background:#eafaf4;border-color:var(--mint)}.chbtn.next{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.badgeico{font-size:1.8rem;filter:grayscale(1);opacity:.35}.badgeico.got{filter:none;opacity:1}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badgecard{background:#fff;border-radius:18px;padding:14px;text-align:center;border:2px solid var(--line);opacity:.75}.badgecard.got{opacity:1;border-color:var(--sun);background:#fffaf0}.badgecard .bigem{font-size:2.4rem}

/* nav, overlays */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab)}
.nav>div{display:flex;max-width:820px;width:100%}
.nav button{flex:1;border:none;background:none;padding:8px 2px 7px;font-weight:800;font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button .e{font-size:1.45rem;line-height:1.1}.nav button.on{color:var(--blue)}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,20,40,.62);display:grid;place-items:center;padding:20px}
.modal .box{background:#fff;border-radius:28px;padding:24px 20px;max-width:420px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-height:90dvh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;font-weight:800;z-index:120;max-width:90vw;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-5px 0}75%{translate:5px 0}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:130;pointer-events:none;animation:fall 2.6s linear forwards}

/* lesson */
.goal{font-size:1.05rem;font-weight:700;color:var(--navy)}.goal.big{font-size:1.45rem;font-family:'Baloo 2'}
.stagecard{padding:10px;background:#fff}
svg.stage{display:block;width:100%;max-width:520px;margin:0 auto;border-radius:14px;background:#f4f8fc;max-height:46vh}
svg.stage.turtle{aspect-ratio:1/1;max-height:none;max-width:420px}
.robot{transition:transform .3s ease}.robot .rot{transition:transform .3s ease}.robot.notrans,.robot.notrans .rot{transition:none}
.robot.bump{animation:shake .25s 3}
.gstar{transition:opacity .2s}
.ctrl{margin:12px 0 4px;flex-wrap:wrap}
.codeview,.outview{background:#10263f;color:#d7e6ff;border-radius:12px;padding:12px;font-size:.9rem;overflow:auto;white-space:pre;margin-top:6px;line-height:1.45}
.outview{background:#0d1b2e;color:#b8f5d8;min-height:2.4em}
ul.tests{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:6px}ul.tests li{font-size:.92rem}ul.tests li.bad{color:#b03a2e}ul.tests li.ok{color:#0a7a5c}
ul.tests code{background:#eef3f9;border-radius:6px;padding:1px 6px}

/* block editor */
.bed .tabs2{display:flex;gap:6px;margin-bottom:8px}.tab2{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-weight:800;font-size:.85rem}.tab2.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.prog{background:#f6f9fd;border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:96px}
.emptyprog{color:var(--muted);text-align:center;padding:10px 0;font-weight:700}
.blist{display:flex;flex-direction:column;gap:6px}
.zone{border:2px dashed #c4d3e6;background:transparent;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.8rem;color:#8396b0;text-align:left}
.zone.cur{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.blk{display:flex;align-items:center;gap:8px;border-radius:12px;padding:8px 10px;color:#fff;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.16);flex-wrap:wrap}
.blk .ic{font-size:1.15rem}.blk .lb{flex:0 1 auto}
.blk.move{background:#2F7DE1}.blk.turn{background:#7A5AF8}.blk.loop{background:#E0902A}.blk.logic{background:#E0529C}.blk.fn{background:#12B58C}.blk.pen{background:#3a8f9e}
.blk.big{padding:12px 14px;font-size:1.25rem;border-radius:16px}.blk.big .ic{font-size:1.8rem}
.step{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);border-radius:999px;padding:2px}.step b{min-width:2.6em;text-align:center;font-size:.95rem}
.step button,.ctl button{border:none;background:rgba(255,255,255,.3);color:#fff;border-radius:999px;width:28px;height:28px;font-weight:900;font-size:1rem}
.ctl{margin-left:auto;display:inline-flex;gap:4px}.ctl .x{background:rgba(0,0,0,.25)}
.csel{border:none;border-radius:8px;padding:4px 6px;font-weight:800;font-size:.85rem;color:var(--navy);background:#fff}
.cblock{border-radius:14px;border:3px solid;padding:0 0 6px;background:#fff}
.cblock.loop{border-color:#E0902A}.cblock.logic{border-color:#E0529C}
.cblock>.blk{border-radius:10px 10px 0 0;box-shadow:none}
.cblock .inner{padding:6px 6px 0 14px;border-left:10px solid rgba(0,0,0,.05)}
.elsehead{font-weight:900;color:#E0529C;padding:4px 12px;font-size:.9rem}
.pallabel{margin:12px 0 6px;font-weight:800;font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.pal{border:none;border-radius:12px;color:#fff;font-weight:800;padding:9px 12px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.16)}.pal:active{transform:translateY(2px)}
.pal.move{background:#2F7DE1}.pal.turn{background:#7A5AF8}.pal.loop{background:#E0902A}.pal.logic{background:#E0529C}.pal.fn{background:#12B58C}.pal.pen{background:#3a8f9e}
.palette.big .pal{font-size:1.2rem;padding:14px 18px;border-radius:18px;flex-direction:column;min-width:88px}.palette.big .pal .ic{font-size:2.2rem}

/* text editor */
textarea.code{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;background:#0d1b2e;color:#e6f1ff;font-size:.95rem;line-height:1.5;tab-size:2;resize:vertical;outline:none;min-height:160px}
textarea.code:focus{border-color:var(--c)}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.snip{flex:none;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;white-space:nowrap}
details.sheet{margin-top:8px;font-size:.9rem}details.sheet summary{font-weight:800;color:var(--navy);cursor:pointer}details.sheet ul{margin:6px 0 0 18px}details.sheet code{background:#eef3f9;border-radius:6px;padding:1px 6px}

/* games */
.gamecard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;font:inherit}.gamecard .em{font-size:2.2rem}.gamecard .tx{display:flex;flex-direction:column;flex:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.opt{border:3px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px;font-weight:800;font-size:1.05rem;font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.opt.right{border-color:var(--mint);background:#eafaf4}.opt.wrong{border-color:var(--coral);background:#fff1f0}
.goodtxt{color:#0a7a5c;font-weight:800}.badtxt{color:#c0392b;font-weight:800}
.buglines{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bugline{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;white-space:pre}
.bugline .ln{color:var(--muted);font-size:.8rem;min-width:1.2em}.bugline.right{border-color:var(--mint);background:#eafaf4}.bugline.wrong{border-color:var(--coral);background:#fff1f0}
.bitrow{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.bit{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 0;width:46px}.bit small{color:var(--muted);font-weight:800}.bit b{font-size:1.5rem;font-family:ui-monospace,Consolas,monospace}.bit.on{background:var(--navy);color:var(--sun);border-color:var(--navy)}.bit.on small{color:#9fb6d9}
.sumline{margin-top:12px;font-weight:800;font-family:ui-monospace,Consolas,monospace;color:var(--navy)}
.bigbin{font-family:ui-monospace,Consolas,monospace;font-size:2.4rem;font-weight:800;letter-spacing:.1em;color:var(--navy);margin:8px 0}
.cardrow{display:flex;gap:8px;align-items:flex-end;justify-content:center;margin:14px 0;min-height:120px}
.sortcard{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;border:3px solid var(--line);background:#fff;border-radius:14px;padding:6px;width:48px;font-weight:800}
.sortcard i{display:block;width:100%;height:var(--hgt,50px);background:var(--c);border-radius:8px;opacity:.75}.sortcard b{font-size:1.1rem;font-family:ui-monospace,Consolas,monospace}.sortcard.sel{border-color:var(--sun);background:#fff8e1;transform:translateY(-6px)}

/* parent */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tab{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
label.check{display:flex;align-items:flex-start;gap:10px;margin-top:10px;font-weight:600}label.check input{margin-top:4px;width:20px;height:20px;flex:none}
ul.plan{margin-left:20px;display:flex;flex-direction:column;gap:6px}
@media (min-width:700px){.lesson{display:block}}
@media print{.nav,.topbar,.btn,.tabs{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="pg-engine.js"></script>
<script src="pg-content.js"></script>
<script src="pg-core.js"></script>
<script src="pg-ui.js"></script>
<script src="pg-games.js"></script>
<script src="pg-parent.js"></script>
<script>PG.start();</script>
<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
